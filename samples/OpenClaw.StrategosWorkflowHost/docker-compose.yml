services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: openclaw
      POSTGRES_PASSWORD: openclaw
      POSTGRES_DB: openclaw_strategos
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openclaw"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  sidecar:
    build:
      context: ../..
      dockerfile: samples/OpenClaw.StrategosWorkflowHost/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=openclaw_strategos;Username=openclaw;Password=openclaw"
      Llm__Mode: Mock
      Logging__LogLevel__Default: Information
      # Selector surface (off by default; uncomment to enable):
      # Strategos__Selector__Enabled: "true"
      # Strategos__Selector__AvailableAgents__0: "mock"
      # Strategos__Selector__Webhook__TokenSecret: "env:OPENCLAW_SELECTOR_TOKEN"
    ports:
      - "8080:8080"
    # Share the MCP App manifest directory with the gateway so the sidecar's
    # openclaw.mcpapp.json is discoverable across the compose network.
    volumes:
      - mcp-apps:/home/app/.openclaw/mcp-apps

  # Optional: only if you also run the OpenClaw gateway in this compose. Uncomment
  # and point its MCP Apps discovery at the same shared volume.
  # gateway:
  #   image: clawdotnet/openclaw-gateway:latest
  #   ports:
  #     - "18789:18789"
  #   environment:
  #     OpenClaw__McpApps__Enabled: "true"
  #     OpenClaw__McpApps__DiscoveryPaths: "/home/app/.openclaw/mcp-apps"
  #   volumes:
  #     - mcp-apps:/home/app/.openclaw/mcp-apps
  #   depends_on:
  #     - sidecar

volumes:
  postgres-data:
  mcp-apps:
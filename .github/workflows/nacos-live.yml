name: Nacos live acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: &paths
      - '.github/workflows/nacos-live.yml'
      - 'eng/NacosLiveSmoke/**'
      - 'eng/nacos-live/**'
      - 'eng/verify-capability-adapters.sh'
      - 'src/OpenClaw.Adapters.Nacos*/**'
      - 'src/OpenClaw.Agent/**'
      - 'src/OpenClaw.Core/**'
      - 'src/OpenClaw.Gateway/**'
      - 'src/OpenClaw.Tests/**'
      - 'Directory.Build.*'
  pull_request:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: nacos-live-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nacos-live-native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: eng/nacos-live/requirements.txt
      - name: Install native toolchain and pinned Router
        run: |
          bash .github/scripts/install-nativeaot-prereqs.sh
          python -m venv "$RUNNER_TEMP/nacos-python"
          "$RUNNER_TEMP/nacos-python/bin/pip" install -r eng/nacos-live/requirements.txt
          "$RUNNER_TEMP/nacos-python/bin/python" -c 'from chromadb.utils.embedding_functions import DefaultEmbeddingFunction; DefaultEmbeddingFunction()(["weather city"])'
          curl --fail --location --retry 3 https://github.com/alibaba/nacos/releases/download/3.2.4/nacos-server-3.2.4.tar.gz -o "$RUNNER_TEMP/nacos.tar.gz"
      - name: Publish NativeAOT Gateway with optional events
        run: dotnet publish src/OpenClaw.Gateway -c Release -r linux-x64 -p:OpenClawEnableNacos=true -p:OpenClawEnableNacosEvents=true -p:OpenClawSkipDashboardBuild=true -o "$RUNNER_TEMP/nacos-gateway"
      - name: Build acceptance executables and runtime tests
        run: |
          dotnet publish eng/NacosLiveSmoke -c Release -r linux-x64 -p:PublishAot=true -o "$RUNNER_TEMP/nacos-native"
          dotnet build eng/NacosLiveSmoke -c Release -p:PublishAot=false
          dotnet build src/OpenClaw.Tests -c Release -p:OpenClawSkipDashboardBuild=true
      - name: Verify authenticated Nacos events and weather binding
        run: |
          "$RUNNER_TEMP/nacos-python/bin/python" eng/nacos-live/verify.py \
            --archive "$RUNNER_TEMP/nacos.tar.gz" \
            --managed eng/NacosLiveSmoke/bin/Release/net10.0/NacosLiveSmoke.dll \
            --native "$RUNNER_TEMP/nacos-native/NacosLiveSmoke" \
            --test-dll src/OpenClaw.Tests/bin/Release/net10.0/OpenClaw.Tests.dll \
            --output "$RUNNER_TEMP/nacos-evidence"
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nacos-live-evidence
          path: |
            ${{ runner.temp }}/nacos-evidence/*.json
            ${{ runner.temp }}/nacos-evidence/*.trx
            ${{ runner.temp }}/nacos-evidence/managed.log
            ${{ runner.temp }}/nacos-evidence/native.log
            ${{ runner.temp }}/nacos-evidence/runtimes.log

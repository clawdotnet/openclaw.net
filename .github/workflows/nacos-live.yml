name: Nacos live acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: &paths
      - '.github/workflows/nacos-live.yml'
      - 'eng/NacosLiveSmoke/**'
      - 'eng/nacos-live/**'
      - 'eng/verify-capability-adapters.sh'
      - 'src/OpenClaw.Adapters.Nacos*/**'
      - 'src/OpenClaw.Agent/**'
      - 'src/OpenClaw.Core/**'
      - 'src/OpenClaw.Gateway/**'
      - 'src/OpenClaw.Tests/**'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
  pull_request:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: nacos-live-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nacos-live-native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '17'
      - name: Install native toolchain and pinned Router
        run: |
          bash .github/scripts/install-nativeaot-prereqs.sh
          dotnet tool install --global NacosMcpRouter --version 1.0.0
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Publish NativeAOT Gateway with optional events
        run: dotnet publish src/OpenClaw.Gateway -c Release -r linux-x64 -p:OpenClawEnableNacos=true -p:OpenClawEnableNacosEvents=true -p:OpenClawSkipDashboardBuild=true -o "$RUNNER_TEMP/nacos-gateway"
      - name: Build acceptance executables and runtime tests
        run: |
          dotnet publish eng/NacosLiveSmoke -c Release -r linux-x64 -p:PublishAot=true -o "$RUNNER_TEMP/nacos-native"
          dotnet build eng/NacosLiveSmoke -c Release -p:PublishAot=false
          dotnet build src/OpenClaw.Tests -c Release -p:OpenClawSkipDashboardBuild=true
      - name: Run .NET harness tests and authenticated Nacos acceptance
        run: |
          dotnet test eng/nacos-live/tests/NacosLiveAcceptance.Tests.csproj -c Release
          dotnet run --project eng/nacos-live/NacosLiveAcceptance.csproj -c Release --no-build -- \
            --managed eng/NacosLiveSmoke/bin/Release/net10.0/NacosLiveSmoke.dll \
            --native "$RUNNER_TEMP/nacos-native/NacosLiveSmoke" \
            --test-dll src/OpenClaw.Tests/bin/Release/net10.0/OpenClaw.Tests.dll \
            --output "$RUNNER_TEMP/nacos-evidence"
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nacos-live-evidence
          path: |
            ${{ runner.temp }}/nacos-evidence/*.json
            ${{ runner.temp }}/nacos-evidence/*.trx
            ${{ runner.temp }}/nacos-evidence/*.log
